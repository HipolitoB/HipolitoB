name: Update Madrid-Time Greek Greeting

on:
  schedule:
    # Covers 05:00, 12:00, and 20:00 Europe/Madrid across both CET (UTC+1) and CEST (UTC+2)
    - cron: '5 3,4,10,11,18,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update greeting in README.md based on Europe/Madrid time
        run: |
          python3 - << 'EOF'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import re
          import sys

          hour = datetime.now(ZoneInfo("Europe/Madrid")).hour
          if 5 <= hour < 12:
              greeting = "### Καλημέρα! · Kalimera 👋"
          elif 12 <= hour < 20:
              greeting = "### Καλησπέρα! · Kalispera 👋"
          else:
              greeting = "### Καληνύχτα! · Kalinixta 👋"

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          new_text, count = re.subn(r"^### .*👋$", greeting, text, count=1, flags=re.MULTILINE)
          if count == 0:
              print("ERROR: Greeting heading regex did not match README.md", file=sys.stderr)
              sys.exit(1)
          if new_text != text:
              readme.write_text(new_text, encoding="utf-8")
              print(f"Updated greeting to: {greeting}")
          else:
              print("Greeting already up to date.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update Madrid-time Greek greeting"
            git push
          fi
